name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app_dev
          load: true
          tags: self-fighter-app
          cache-from: type=gha,scope=app_dev
          cache-to: type=gha,scope=app_dev,mode=max
      - run: make up
      - run: make lint-backend
      - run: make test-backend
      - run: make audit-backend
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make .env
      - name: Start the Node container
        run: docker compose up -d --wait --wait-timeout 300 node
      - run: make lint-frontend
      - run: make test-frontend
      - run: make bundle
      - run: make audit-frontend
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail=200

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_FILE: compose.yaml:compose.prod.yaml
      APP_SECRET: ci-secret
      SERVER_NAME: localhost
      MYSQL_PASSWORD: ci-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make lint-infra
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app_prod
          load: true
          tags: self-fighter-app:prod
          cache-from: type=gha,scope=app_prod
          cache-to: type=gha,scope=app_prod,mode=max
      # Not aquasecurity/trivy-action: its tags were hijacked in March 2026 (CVE-2026-33634).
      # The scanner runs from a pinned image and sees only the image archive.
      - name: Scan the image for vulnerabilities
        run: |
          docker save self-fighter-app:prod --output image.tar
          docker run --rm --volume "$PWD/image.tar:/image.tar:ro" "$TRIVY_IMAGE" image \
            --input /image.tar --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - name: Run migrations in a separate container
        run: docker compose run --rm app php bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing --allow-no-migration
      - name: Start the production stack
        run: docker compose up -d --no-build --wait --wait-timeout 300
      - name: Smoke test
        run: .github/scripts/smoke-test.sh https://localhost
        env:
          SMOKE_INSECURE: 1
      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color --tail=200
