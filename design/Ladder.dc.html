<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Драбина</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111214}
a{color:#FF6B2C}a:hover{color:#FF8A55}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111214; color: #F3F1EA; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 34px; gap: 20px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #A3A6AD">ДРАБИНА · З ПОВЕРНЕННЯМ</span>
      <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 18px">Підтягування</span>
    </div>
    <a href="Modes.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2C2F35; color: #C9CBD1; font-size: 14px; font-weight: 700; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Перервати
    </a>
  </div>

  <section aria-label="{{progressLabel}}" style="display: flex; flex-direction: column; gap: 10px">
    <div style="height: 168px; display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; align-items: end">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="9">
        <div style="{{s.style}}">
          <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 14px">{{s.v}}</span>
          <span style="font-size: 11px; font-weight: 700">{{s.mark}}</span>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 13px; color: #A3A6AD">
      <span>Етап {{num}} з 9</span><span>Пройдено: {{passed}}</span>
    </div>
  </section>

  <sc-if value="{{playing}}" hint-placeholder-val="{{ true }}">
    <section style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 4px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #A3A6AD">{{dir}}</span>
      <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 96px; line-height: 1">{{target}}</span>
      <span style="font-size: 15px; color: #C9CBD1">{{need}}</span>
    </section>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <label for="lreps" style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #FF6B2C">СКІЛЬКИ ЗРОБИВ</label>
      <input id="lreps" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="{{val}}" onChange="{{set}}" style="width: 100%; height: 76px; box-sizing: border-box; border-radius: 14px; border: 2px solid #FF6B2C; background: #1B1D21; color: #FF6B2C; text-align: center; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 44px">
    </section>
    <button type="button" onClick="{{confirm}}" style="margin-top: auto; min-height: 58px; border: 0; border-radius: 12px; background: #FF6B2C; color: #111214; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">Зафіксувати етап</button>
  </sc-if>

  <sc-if value="{{over}}" hint-placeholder-val="{{ false }}">
    <section role="status" style="{{endStyle}}">
      <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 34px">{{endTitle}}</span>
      <span style="font-size: 15px; line-height: 1.5">{{endText}}</span>
    </section>
    <div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button type="button" onClick="{{restart}}" style="min-height: 56px; border: 0; border-radius: 12px; background: #FF6B2C; color: #111214; font-family: inherit; font-weight: 700; font-size: 16px; cursor: pointer">Повторити</button>
      <a href="History.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 12px; border: 1px solid #3A3E45; color: #F3F1EA; font-weight: 700; font-size: 16px; text-decoration: none">Історія</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { idx: 6, val: '', failed: false, lastVal: null }; }
  renderVals() {
    const seq = [1, 2, 3, 4, 5, 4, 3, 2, 1];
    const max = 5, rule = 'meet';
    const s = this.state;
    const done = s.idx >= seq.length;
    const over = done || s.failed;
    const steps = seq.map((v, i) => {
      const h = Math.round(36 + (v / max) * 120);
      let st = 'height: ' + h + 'px; border-radius: 8px 8px 4px 4px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 8px; gap: 2px; box-sizing: border-box; ';
      let mark = '';
      if (i < s.idx) { st += 'background: #FF6B2C; color: #111214;'; mark = '✓'; }
      else if (i === s.idx && s.failed) { st += 'background: #2C2F35; color: #F3F1EA; border: 2px dashed #5B9BFF;'; mark = '✕'; }
      else if (i === s.idx) { st += 'background: #F3F1EA; color: #111214;'; mark = '●'; }
      else { st += 'background: #1B1D21; color: #A3A6AD; border: 1px solid #2C2F35;'; }
      return { v, style: st, mark };
    });
    const target = seq[Math.min(s.idx, seq.length - 1)];
    const passed = Math.min(s.idx, seq.length);
    const n = parseInt(s.val, 10);
    const endBase = 'display: flex; flex-direction: column; gap: 8px; padding: 22px; border-radius: 16px; ';
    return {
      steps, num: Math.min(s.idx + 1, seq.length), passed, target, val: s.val,
      progressLabel: 'Пройдено ' + passed + ' з ' + seq.length + ' етапів',
      dir: s.idx < max ? 'ПІДЙОМ · ЦІЛЬ' : 'СПУСК · ЦІЛЬ',
      need: rule === 'meet' ? 'Зроби ' + target + ' або більше' : 'Зроби більше ' + target,
      playing: !over, over,
      endTitle: done ? '▲ Перемога' : '▼ Поразка',
      endText: done ? 'Пройдено всі 9 етапів: підйом до 5 і спуск до 1.' : 'Етап ' + (s.idx + 1) + ' (ціль ' + target + ') не пройдено: ' + s.lastVal + '. Максимальний пройдений етап — ' + (s.idx > 0 ? seq.slice(0, s.idx).reduce((a, b) => Math.max(a, b), 0) : 0) + ', пройдено етапів: ' + passed + '.',
      endStyle: endBase + (done ? 'background: #FF6B2C; color: #111214;' : 'background: #1B1D21; color: #F3F1EA; border: 2px solid #5B9BFF;'),
      set: (e) => this.setState({ val: String(e.target.value).replace(/[^0-9]/g, '') }),
      confirm: () => {
        if (s.val === '' || isNaN(n)) return;
        const ok = rule === 'meet' ? n >= target : n > target;
        if (ok) this.setState({ idx: s.idx + 1, val: '' });
        else this.setState({ failed: true, lastVal: n });
      },
      restart: () => this.setState({ idx: 0, val: '', failed: false, lastVal: null })
    };
  }
}
</script>
</body>
</html>
