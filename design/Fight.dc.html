<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Активний бій</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111214}
a{color:#FF6B2C}a:hover{color:#FF8A55}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111214; color: #F3F1EA; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column; padding: 56px 20px 34px; gap: 20px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #A3A6AD">ВИПАДКОВИЙ СУПЕРНИК</span>
      <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 18px">Раунд 3 з 5</span>
    </div>
    <a href="Modes.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid #2C2F35; color: #C9CBD1; font-size: 14px; font-weight: 700; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>Перервати
    </a>
  </div>

  <div aria-label="Прогрес: етап 6 з 10" style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
    <span style="height: 6px; border-radius: 3px; background: #FF6B2C"></span><span style="height: 6px; border-radius: 3px; background: #FF6B2C"></span><span style="height: 6px; border-radius: 3px; background: #FF6B2C"></span><span style="height: 6px; border-radius: 3px; background: #FF6B2C"></span><span style="height: 6px; border-radius: 3px; background: #FF6B2C"></span>
    <span style="height: 6px; border-radius: 3px; background: #F3F1EA"></span>
    <span style="height: 6px; border-radius: 3px; background: #2C2F35"></span><span style="height: 6px; border-radius: 3px; background: #2C2F35"></span><span style="height: 6px; border-radius: 3px; background: #2C2F35"></span><span style="height: 6px; border-radius: 3px; background: #2C2F35"></span>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em">
    <span style="color: #FF6B2C">ТИ</span>
    <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-size: 20px; color: #FF6B2C">1</span>
    <span style="color: #5E626A">:</span>
    <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-size: 20px; color: #5B9BFF">1</span>
    <span style="color: #5B9BFF">СУПЕРНИК</span>
    <span style="color: #A3A6AD; font-weight: 500; letter-spacing: 0">· раунди</span>
  </div>

  <section style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 4px">
    <span style="font-size: 13px; color: #A3A6AD">Вправа 2 з 2</span>
    <h1 style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 34px">Присідання</h1>
  </section>

  <section style="border: 2px solid #5B9BFF; border-radius: 16px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #5B9BFF">СУПЕРНИК ЗРОБИВ</span>
      <span style="font-size: 14px; color: #C9CBD1">{{need}}</span>
    </div>
    <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 56px; line-height: 1; color: #5B9BFF">34</span>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <label for="reps" style="font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #FF6B2C">СКІЛЬКИ ЗРОБИВ ТИ</label>
    <div style="display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: stretch">
      <button type="button" aria-label="Мінус одне повторення" onClick="{{dec}}" disabled="{{locked}}" style="height: 88px; border: 0; border-radius: 14px; background: #1B1D21; color: #F3F1EA; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
      <input id="reps" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0" value="{{val}}" onChange="{{set}}" readOnly="{{locked}}" style="width: 100%; min-width: 0; height: 88px; box-sizing: border-box; border-radius: 14px; border: 2px solid #FF6B2C; background: #1B1D21; color: #FF6B2C; text-align: center; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 52px">
      <button type="button" aria-label="Плюс одне повторення" onClick="{{inc}}" disabled="{{locked}}" style="height: 88px; border: 0; border-radius: 14px; background: #1B1D21; color: #F3F1EA; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
    <sc-if value="{{err}}" hint-placeholder-val="{{ false }}">
      <p role="alert" style="margin: 0; font-size: 14px; color: #FFB08A">Введи ціле число від 0 — порожнє поле не рахується.</p>
    </sc-if>
  </section>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
      <div role="status" style="{{fbStyle}}">
        <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 20px">{{fbTitle}}</span>
        <span style="font-size: 15px; font-weight: 500">{{fbText}}</span>
      </div>
      <a href="Result.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 12px; background: #F3F1EA; color: #111214; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 16px; text-decoration: none">Завершити раунд 3
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </sc-if>
    <sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{confirm}}" style="min-height: 58px; border: 0; border-radius: 12px; background: #FF6B2C; color: #111214; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 17px; cursor: pointer">Зафіксувати результат</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { val: '35', done: false, err: false, rule: 'over' }; }
  renderVals() {
    const s = this.state, opp = 34;
    const n = parseInt(s.val, 10);
    const bump = (d) => { if (s.done) return; const cur = isNaN(n) ? 0 : n; this.setState({ val: String(Math.max(0, cur + d)), err: false }); };
    let fbTitle = '', fbText = '', fbStyle = '';
    if (s.done) {
      const win = s.rule === 'over' ? n > opp : n >= opp;
      const base = 'display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 14px; ';
      if (win) { fbTitle = '▲ Перемога у вправі'; fbText = n + ' проти ' + opp + '. Раунд 3: 1 перемога, 1 поразка — нічия.'; fbStyle = base + 'background: #FF6B2C; color: #111214;'; }
      else { fbTitle = '▼ Поразка у вправі'; fbText = n + ' проти ' + opp + (s.rule === 'over' ? ' — потрібно більше ' + opp + '.' : '.'); fbStyle = base + 'background: #2C2F35; color: #F3F1EA; border: 2px solid #5B9BFF;'; }
    }
    return {
      val: s.val, locked: s.done, done: s.done, notDone: !s.done, err: s.err,
      need: s.rule === 'over' ? 'Щоб виграти — більше ' + opp : 'Щоб виграти — ' + opp + ' або більше',
      set: (e) => { if (!s.done) this.setState({ val: String(e.target.value).replace(/[^0-9]/g, ''), err: false }); },
      dec: () => bump(-1), inc: () => bump(1),
      confirm: () => { if (s.done) return; if (s.val === '' || isNaN(n)) { this.setState({ err: true }); return; } this.setState({ done: true }); },
      fbTitle, fbText, fbStyle
    };
  }
}
</script>
</body>
</html>
