<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Вибір режиму</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111214}
a{color:#FF6B2C}a:hover{color:#FF8A55}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #111214; color: #F3F1EA; font-family: Manrope, 'Segoe UI', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 56px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <a href="Main.dc.html" aria-label="На головну" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #F3F1EA; min-height: 44px">
      <svg width="26" height="26" viewBox="0 0 36 36" aria-hidden="true"><path d="M3 6 L16 18 L3 30 Z" fill="#FF6B2C"></path><path d="M33 6 L20 18 L33 30 Z" fill="#5B9BFF"></path></svg>
      <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 15px">SELF‑FIGHTER</span>
    </a>
    <a href="History.dc.html" aria-label="Історія" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; border: 1px solid #2C2F35; color: #F3F1EA">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l3 2"></path></svg>
    </a>
  </div>

  <div style="padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.14em; color: #A3A6AD">КРОК 1 З 2</span>
    <h1 style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 28px; line-height: 1.1">Обери режим</h1>
  </div>

  <div role="radiogroup" aria-label="Режим тренування" style="padding: 0 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{modes}}" as="m" hint-placeholder-count="4">
      <button type="button" role="radio" aria-checked="{{m.checked}}" onClick="{{m.pick}}" style="{{m.style}}">
        <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 900; font-size: 13px; opacity: 0.7">{{m.num}}</span>
        <span style="font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2">{{m.name}}</span>
      </button>
    </sc-for>
  </div>

  <section style="margin: 20px 20px 0; padding: 20px; border: 1px solid #2C2F35; border-radius: 14px; background: #1B1D21; display: flex; flex-direction: column; gap: 14px">
    <h2 style="margin: 0; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 18px">{{cur.name}}</h2>
    <dl style="margin: 0; display: flex; flex-direction: column; gap: 12px; font-size: 15px; line-height: 1.45">
      <div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #A3A6AD">ЗАВДАННЯ</dt><dd style="margin: 0">{{cur.task}}</dd></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #A3A6AD">ПЕРЕМОГА</dt><dd style="margin: 0">{{cur.win}}</dd></div>
      <div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #A3A6AD">ТРИВАЛІСТЬ</dt><dd style="margin: 0">{{cur.len}}</dd></div>
    </dl>
  </section>

  <div style="margin-top: auto; padding: 20px 20px 34px; display: flex; flex-direction: column; gap: 12px">
    <a href="SetupTarget.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; border-radius: 12px; background: #FF6B2C; color: #111214; font-family: Unbounded, 'Arial Black', sans-serif; font-weight: 700; font-size: 16px; text-decoration: none">Далі — налаштування
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: 'target' }; }
  renderVals() {
    const data = [
      { id: 'target', num: '01', name: 'Ціль', task: 'Виконати задану кількість повторень для кожної вправи в кожному раунді.', win: 'Більше виграних раундів, ніж програних. Раунд — за кількістю виграних вправ.', len: 'Раунди × вправи. Наприклад, 5 раундів × 2 вправи = 10 етапів.' },
      { id: 'random', num: '02', name: 'Випадковий суперник', task: 'Побити результат суперника — він випадковий у заданому тобою діапазоні.', win: 'Більше виграних раундів, ніж програних. Рівна кількість — нічия.', len: 'Раунди × вправи. Результат суперника видно до твого підходу.' },
      { id: 'levels', num: '03', name: 'Рівні суперників', task: 'Змагатися із суперником обраної складності: простий, середній чи складний.', win: 'Як у «Випадковому суперникові»: вправи → раунди → бій.', len: 'Раунди × вправи.' },
      { id: 'ladder', num: '04', name: 'Драбина', task: 'Пройти етапи 1 → 2 → … → максимум, за бажанням і назад униз. Одна вправа.', win: 'Пройдено всі етапи. Один непройдений етап — поразка. Нічиєї немає.', len: 'Максимум 5: 5 етапів, з поверненням — 9.' }
    ];
    const picked = this.state.picked;
    const modes = data.map((d) => {
      const on = d.id === picked;
      return { ...d, checked: on ? 'true' : 'false', pick: () => this.setState({ picked: d.id }),
        style: 'min-height: 104px; padding: 14px; border-radius: 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; font-family: inherit; ' +
          (on ? 'background: #FF6B2C; color: #111214; border: 2px solid #FF6B2C;' : 'background: #1B1D21; color: #F3F1EA; border: 2px solid #2C2F35;') };
    });
    const cur = data.find((d) => d.id === picked);
    return { modes, cur };
  }
}
</script>
</body>
</html>
