# Texts of the pages Twig renders. The game keeps its own texts in frontend/src/i18n.
site:
  name: Self-Fighter
  # How people say the name; search engines take it from the structured data of the home page.
  alternate_name: Селф Файтер
  skip_to_content: Перейти до змісту
  start: Почати тренування
  breadcrumbs: Ти тут
  og_image_alt: Логотип Self-Fighter, гетьман у багряному кунтуші з булавою й напис «Від джури до гетьмана — підхід за підходом»
  nav:
    label: Головна навігація
    game: Гра
    about: Про проєкт
    privacy: Приватність
    history: Історія
    settings: Налаштування
  footer:
    nav_label: Навігація сайтом
    home: Головна
    consent: Згода на аналітику
    data: Історія тренувань зберігається на сервері. Без входу вона прив'язана до цього браузера, а вхід через Google відкриває її на будь-якому пристрої.
  # §22. A draft: the final text comes with the privacy policy at stage 10 of the plan.
  consent:
    label: Згода на аналітику
    text: Дозволиш рахувати старти й завершення тренувань, щоб ми бачили, чи гра корисна? Події пов'язані з ідентифікатором твого користувача, гостя чи облікового запису, і не містять IP-адреси. Без дозволу гра працює так само.
    more: Докладніше
    allow: Дозволити
    deny: Відхилити
    granted: Зараз аналітику дозволено.
    denied: Зараз аналітику відхилено.

home:
  title: Self-Fighter — козацька гра для тренувань з власною вагою
  description: "Гра «Козак»: бої з відтискань, присідань і підтягувань, похід «Січ» проти розбійників і слава від джури до гетьмана. Безкоштовно й без реєстрації."
  no_signup: Реєстрація не потрібна
  hero:
    eyebrow: Гра «Козак»
    # No line breaks before the dash or after a short preposition.
    title: "Від джури до\u00A0гетьмана\u00A0— підхід за\u00A0підходом."
    lead: Self-Fighter перетворює тренування з власною вагою на козацьку гру. Складай бої з відтискань, присідань і підтягувань, вирушай у похід проти розбійницьких ватаг і здобувай славу для свого козака.
    journey: Вирушити в похід
  game:
    eyebrow: Що на тебе чекає
    title: Тренування, у яке хочеться грати
    lead: Гра ставить ціль на кожен підхід, рахує перемоги й пам'ятає, де ти зупинився.
    fight:
      name: Бій
      text: Склади бій із вправ і раундів і виконай кожен підхід. Усі підходи виконано — перемога, а відступ лишає бій програним.
    journey:
      name: Похід «Січ»
      text: Три кампанії проти розбійницьких ватаг і фінальний двобій з їхнім Королем. Рівні ростуть поступово, від кількох повторень до битв із ватажками.
    glory:
      name: Слава й звання
      text: Кожна перемога додає козакові слави. Двадцять звань ведуть від джури до гетьмана, і з ними багатшає вбрання козака.
    energy:
      name: Енергія
      text: "Бої й похід мають свою енергію, і вона відновлюється сама: одиниця щодві години. Тож гра кличе тренуватися регулярно, а не вичавити все за один вечір."
  fight:
    eyebrow: Бій
    title: Бій, який складаєш сам
    lead: Вправи — рядки, раунди — стовпці, а в кожній клітинці кількість повторень. Відтискання, присідання, підтягування чи власна вправа, від одного до десяти раундів.
    points:
      order: "Підходи йдуть по колу: спершу перший підхід кожної вправи, потім другий."
      done: Зробив підхід — натисни «Підхід виконано». Відпочивай скільки треба, таймера немає.
      win: Виконав усі підходи — перемога й слава козакові. Кожен бій лишається в історії.
  preview:
    caption: Приклад бою, що триває
    mode: Бій
    round: Раунд 2 / 3
    done: "%done% з %total%"
    progress: підходів виконано
    exercise: Вправа
    round_head: Р%round%
    round_name: Раунд %round%
    set_done: виконано
    set_now: зараз
  journey:
    eyebrow: Похід «Січ»
    title: Три ватаги й Король розбійників
    lead: "Неспокійно на землях Січі: зникають подорожні, грабують валки й хутори. За нападами стоять три розбійницькі ватаги, яких об'єднав таємничий Король розбійників."
    stages: Кожна кампанія — десять етапів, і кожен закінчується битвою з ватажком. Похід триває днями, бо енергія походу відновлюється поступово.
    black-flag:
      name: Чорний прапор
      exercise: Відтискання · до 25 за підхід
      lead: Велика, нахабна й добре озброєна ватага, яка тримає в страху дороги навколо Січі.
    steppe-wolves:
      name: Степові вовки
      exercise: Присідання · до 50 за підхід
      lead: "Вершники тримають степові шляхи: швидкі нальоти, засідки й грабунок торгових валок."
    forest-ravens:
      name: Лісові круки
      exercise: Підтягування · до 10 за підхід
      lead: Банда лісових розбійників тримає дороги й переправи, а награбоване ховає в глухих хащах.
    final-battle:
      name: Фінальна битва
      exercise: Двобій у п'яти раундах
      lead: Король розбійників — колишній козак, що зрадив Січ і зібрав три ватаги в справжню армію. Хто його переможе, стане Оборонцем Січі й отримає його шаблю.
  ranks:
    eyebrow: Слава й звання
    title: Від джури до гетьмана
    lead: "Двадцять звань у п'яти образах. Що вище звання, то багатше вбрання: від простої сорочки з києм до багряного кунтуша з булавою."
    from: від %glory% слави
    looks:
      recruit: Джура
      cossack: Козак
      officer: Сотник
      general: Генерал-осавул
      hetman: Гетьман
    rewards:
      title: За що дають славу
      fight: перемога в бою
      level: рівень походу
      boss: битва з ватажком
      round: раунд двобою з Королем
      campaign: пройдена кампанія
      journey: перемога над Королем
  how:
    title: Як почати
    open:
      title: Відкрий гру
      text: "Реєстрація не потрібна: прогрес зберігається на сервері. Увійди через Google, щоб грати з кількох пристроїв."
    choose:
      title: Обери бій або похід
      text: Склади власний бій із вправ і раундів або вирушай у похід «Січ» назустріч розбійникам.
    play:
      title: Виконуй підходи
      text: "Тренуйся сам, без камери: зробив підхід — натисни кнопку. Гра рахує перемоги, славу й рекорди."
  cta:
    title: "Перший бій\u00A0— зараз."

