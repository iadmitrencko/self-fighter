# Texts of the pages Twig renders. The game keeps its own texts in frontend/src/i18n.
site:
  name: Self-Fighter
  # How people say the name; search engines take it from the structured data of the home page.
  alternate_name: Селф Файтер
  skip_to_content: Перейти до змісту
  start: Почати тренування
  breadcrumbs: Ти тут
  score:
    title: Твій рахунок
    total: Тренування
    wins: Перемоги
    draws: Нічиї
    losses: Поразки
  og_image_alt: Self-Fighter — тренування у форматі гри
  nav:
    label: Головна навігація
    game: Гра
    guides: Поради
    about: Про проєкт
    privacy: Приватність
    history: Історія
    settings: Налаштування
  footer:
    nav_label: Навігація сайтом
    home: Головна
    consent: Згода на аналітику
    data: Історія тренувань зберігається на сервері. Без входу вона прив'язана до цього браузера, а вхід через Google відкриває її на будь-якому пристрої.
  # §22. A draft: the final text comes with the privacy policy at stage 10 of the plan.
  consent:
    label: Згода на аналітику
    text: Дозволиш рахувати старти й завершення тренувань, щоб ми бачили, чи гра корисна? Події пов'язані з ідентифікатором твого користувача, гостя чи облікового запису, і не містять IP-адреси. Без дозволу гра працює так само.
    more: Докладніше
    allow: Дозволити
    deny: Відхилити
    granted: Зараз аналітику дозволено.
    denied: Зараз аналітику відхилено.

home:
  title: Self-Fighter — тренування у форматі гри
  description: "Перетвори тренування на гру: склади бій із вправ і раундів, виконуй підходи, здобувай славу й звання козака. Свої вправи, історія, без реєстрації."
  no_signup: Реєстрація не потрібна
  hero:
    eyebrow: Тренування у форматі гри
    title: "Перетвори тренування на гру."
    lead: Склади бій із вправ і раундів, виконай кожен підхід і здобудь славу для свого козака.
  preview:
    caption: Приклад бою, що триває
    mode: Бій
    round: Раунд 2 / 3
    done: "%done% з %total%"
    progress: підходів виконано
    exercise: Вправа
    round_head: Р%round%
    round_name: Раунд %round%
    set_done: виконано
    set_now: зараз
  game:
    title: Бій, який складаєш сам
    lead: "Будь-які вправи, від одного до десяти раундів і стільки повторень у підході, скільки потрібно саме тобі."
    grid:
      name: Вправи й раунди
      text: Вправи — рядки, раунди — стовпці, у кожній клітинці кількість повторень. Новий раунд повторює попередній.
    sets:
      name: Підхід за підходом
      text: "Виконав підхід — натисни «Виконано». Відпочивай скільки треба: таймера немає."
    glory:
      name: Слава й звання
      text: Перемога в бою додає козакові славу, а з нею приходять нові звання й новий вигляд.
    journey:
      name: Похід «Січ»
      text: Готові рівні від простих до битв із ватажками. Енергія відновлюється сама, тож похід триває днями.
  how:
    title: Як це працює
    setup:
      title: Склади бій
      text: Додай вправи, задай кількість раундів і повторень у кожному підході.
    exercise:
      title: Виконуй підходи
      text: Тренуєшся самостійно й позначаєш кожен виконаний підхід. Ніякої камери.
    result:
      title: Здобудь славу
      text: Виконано всі підходи — перемога і слава козакові. Кожен бій потрапляє в історію.
  why:
    title: Чому це працює
    goal:
      title: Чітка ціль щоразу
      text: Кожен підхід — це конкретне число, яке треба виконати.
    progress:
      title: Видно прогрес
      text: Історія боїв, рахунок перемог і поразок, звання козака.
    no_signup:
      title: Без реєстрації
      text: Відкрий сайт — і ти вже в бою.
    exercises:
      title: Твої вправи
      text: Додай власну вправу один раз — і склади з нею будь-який бій.
  cta:
    title: Перший раунд — зараз.

# The exercises of the example fight on the landing.
exercise:
  push-ups: Віджимання
  squats: Присідання
  pull-ups: Підтягування

guides:
  title: Поради для тих, хто тренується вдома
  description: 'Як тренуватися регулярно, що таке тренування драбиною і як підібрати навантаження: короткі поради для тих, хто тренується самостійно.'
  heading: Поради
  lead: Відповіді на запитання, які виникають у тих, хто тренується самостійно.

guide_page:
  eyebrow: Порада

