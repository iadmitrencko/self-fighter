content:
  all_challenges: Усі виклики

challenges:
  title: 'Готові виклики: віджимання, присідання й підтягування'
  description: 'Готові тренування з власною вагою: суми повторень по раундах, драбини, піраміди й кругові тренування для дому. Обери виклик і почни одразу.'
  heading: Готові виклики
  lead: Кожна сторінка показує всю програму, а кнопка «Почати виклик» відкриває її в грі з уже заповненими налаштуваннями.
  mixed: Кілька вправ
  progress: Пройдено викликів

challenge:
  level:
    easy: Легкий рівень
    medium: Середній рівень
    hard: Складний рівень
  facts:
    rounds: Раунди
    stages: Етапи
    reps: Повторень разом
    rule: Умова перемоги
  rule:
    meet: Виконати
    over: Перевиконати
  start: Почати виклик
  passed: Пройдено
  start_note: Налаштування вже заповнено, їх можна змінити перед стартом.
  program: Програма
  stages_label: Повторень на кожному етапі
  program_table: Цілі за раундами
  round: Раунд
  total: Разом
  pass:
    rounds:
      meet: Вправу зараховано, якщо зроблено щонайменше ціль. Раунд виграно, коли виграних вправ у ньому більше, ніж програних.
      over: Вправу зараховано, якщо зроблено більше за ціль. Раунд виграно, коли виграних вправ у ньому більше, ніж програних.
    ladder:
      meet: Етап зараховано, якщо зроблено щонайменше вказану кількість повторень. Перший непройдений етап завершує спробу.
      over: Етап зараховано, якщо зроблено на одне повторення більше за вказане, а на вершині вистачить і рівно максимуму. Перший непройдений етап завершує спробу.
  audience_title: Для кого
  audience:
    easy: Для тих, хто тільки починає або повертається до тренувань після перерви. Обсяг невеликий, і на нього вистачить навіть короткого вільного вікна.
    medium: Для тих, хто тренується регулярно й упевнено робить кілька підходів поспіль. Виклик потребує зусиль, але не виснажує до відмови.
    hard: Для підготовлених, кому знайомі схожі обсяги. Якщо легший виклик цієї серії ще дається важко, почни з нього.
  adjust_title: Як змінити навантаження
  adjust:
    rounds: Легше — перед стартом зменш цілі в таблиці або кількість раундів, гра дозволяє змінити будь-яке значення. Складніше — обери умову «Перевиконати», і вправу буде зараховано лише з повторенням понад ціль.
    ladder: Легше — перед стартом зменш вершину драбини. Складніше — увімкни повернення вниз, і драбина стане пірамідою, або обери умову «Перевиконати».
    pyramid: Легше — вимкни повернення вниз, і лишиться звичайна драбина до тієї ж вершини. Складніше — обери умову «Перевиконати», за якої кожен етап, крім вершини, потребує на одне повторення більше.
  easier: 'Легший виклик:'
  harder: 'Складніший виклик:'
  note_title: Про цей виклик
  links_title: Вправи й режим
  exercise_link: '%name%: техніка й типові помилки'
  mode_link: Як працює режим «%name%»
  related_title: Схожі виклики

exercises:
  title: 'Вправи з власною вагою: техніка й готові виклики'
  description: 'Віджимання, присідання й підтягування: як виконувати кожну вправу правильно, типові помилки, легші й складніші варіанти та готові виклики.'
  heading: Вправи
  lead: Три базові вправи, для яких не потрібен зал. На сторінці кожної — техніка, типові помилки й готові виклики.

exercise_page:
  eyebrow: Вправа
  challenges_title: Готові виклики з цією вправою

modes:
  title: 'Режими тренування: ціль, суперник і драбина'
  description: 'Чотири способи кинути собі виклик: власні цілі, випадковий суперник, суперник обраного рівня й драбина. Як працює кожен режим і кому він підходить.'
  heading: Режими
  lead: Усі режими працюють зі спільним каталогом вправ і рахують результат за однаковими правилами, а відрізняються тим, хто твій суперник.

mode_page:
  eyebrow: Режим гри
  start: Спробувати режим
  challenges_title: Готові виклики в цьому режимі
  no_challenges: Готових викликів у цьому режимі поки немає, бо суперника тут налаштовуєш ти. Ідеї для тренувань є в каталозі.

guides:
  title: Поради для тих, хто тренується вдома
  description: 'Як тренуватися регулярно, що таке тренування драбиною і як підібрати навантаження: короткі поради для тих, хто тренується самостійно.'
  heading: Поради
  lead: Відповіді на запитання, які виникають у тих, хто тренується самостійно.

guide_page:
  eyebrow: Порада

