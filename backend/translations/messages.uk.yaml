# Texts of the pages Twig renders. The game keeps its own texts in frontend/src/i18n.
site:
  name: Self-Fighter
  # How people say the name; search engines take it from the structured data of the home page.
  alternate_name: Селф Файтер
  skip_to_content: Перейти до змісту
  start: Почати тренування
  breadcrumbs: Ти тут
  score:
    title: Твій рахунок
    total: Тренування
    wins: Перемоги
    draws: Нічиї
    losses: Поразки
  og_image_alt: Self-Fighter — тренування у форматі гри
  nav:
    label: Головна навігація
    game: Гра
    guides: Поради
    about: Про проєкт
    privacy: Приватність
    history: Історія
    settings: Налаштування
  footer:
    nav_label: Навігація сайтом
    home: Головна
    consent: Згода на аналітику
    data: Історія тренувань зберігається на сервері. Без входу вона прив'язана до цього браузера, а вхід через Google відкриває її на будь-якому пристрої.
  # §22. A draft: the final text comes with the privacy policy at stage 10 of the plan.
  consent:
    label: Згода на аналітику
    text: Дозволиш рахувати старти й завершення тренувань, щоб ми бачили, чи гра корисна? Події пов'язані з ідентифікатором твого користувача, гостя чи облікового запису, і не містять IP-адреси. Без дозволу гра працює так само.
    more: Докладніше
    allow: Дозволити
    deny: Відхилити
    granted: Зараз аналітику дозволено.
    denied: Зараз аналітику відхилено.

home:
  title: Self-Fighter — тренування у форматі гри
  description: "Перетвори тренування на гру: перемагай віртуального суперника, проходь драбину чи власні цілі. Чотири режими, свої вправи, історія. Без реєстрації."
  no_signup: Реєстрація не потрібна
  hero:
    eyebrow: Тренування у форматі гри
    title: "Перетвори тренування на гру."
    lead: Обирай вправи, приймай виклик, перемагай суперника або проходь власні цілі.
  preview:
    caption: Приклад бою з випадковим суперником
    mode: Випадковий суперник
    round: Раунд 3 / 5
    you: Ти
    rival: Суперник
    score: рахунок раундів
    exercise: Вправа
    result: Результат
    win: Перемога
    loss: Поразка
  modes:
    title: Чотири способи кинути собі виклик
    lead: "Усі режими працюють зі спільним каталогом вправ: віджимання, присідання, підтягування — або власні."
    target:
      name: Ціль
      text: Задай кількість повторень для кожної вправи в кожному раунді — і виконай або перевиконай її.
    random_opponent:
      name: Випадковий суперник
      text: Суперник отримує випадковий результат у заданому тобою діапазоні. Побий його.
    opponent_levels:
      name: Рівні суперників
      text: Обери складність — простий, середній чи складний. Складний іноді перевершує сам себе.
    ladder:
      name: Драбина
      text: "1 → 2 → 3 … до максимуму. За бажанням — і назад униз. Один промах — і спробу завершено."
  how:
    title: Як це працює
    setup:
      title: Налаштуй бій
      text: "Обери режим, вправи, кількість раундів і правило перемоги: виконати чи перевиконати."
    exercise:
      title: Зроби вправу — введи число
      text: Тренуєшся самостійно й вписуєш, скільки повторень вдалося зробити. Ніякої камери.
    result:
      title: Дізнайся результат
      text: Перемога чи поразка в кожній вправі, підсумок раунду й бою — усе потрапляє в історію.
  why:
    title: Чому це працює
    goal:
      title: Чітка ціль щоразу
      text: Кожен підхід — це конкретне число, яке треба побити.
    progress:
      title: Видно прогрес
      text: Історія спроб і рахунок перемог, нічиїх і поразок.
    no_signup:
      title: Без реєстрації
      text: Відкрий сайт — і ти вже в бою.
    exercises:
      title: Твої вправи
      text: Додай власну вправу один раз — використовуй у будь-якому режимі.
  cta:
    title: Перший раунд — зараз.

# The exercises of the example fight on the landing.
exercise:
  push-ups: Віджимання
  squats: Присідання
  pull-ups: Підтягування

guides:
  title: Поради для тих, хто тренується вдома
  description: 'Як тренуватися регулярно, що таке тренування драбиною і як підібрати навантаження: короткі поради для тих, хто тренується самостійно.'
  heading: Поради
  lead: Відповіді на запитання, які виникають у тих, хто тренується самостійно.

guide_page:
  eyebrow: Порада

kozak:
  title: Гра
  noscript: Гра працює в браузері з увімкненим JavaScript.

