# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Browsers send a secure cookie over HTTPS only.
    app.device_cookie_secure: true

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            # Every module that keeps data of users takes part in the deletion and in joining a guest to an account.
            iterable $userData: !tagged_iterator app.user_data

    _instanceof:
        App\Shared\Application\UserDataHolder:
            tags: [app.user_data]

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Entities and value objects are created by the code, never by the container.
        exclude: '../src/*/Domain/'

    # The repositories the domain declares and the adapters that implement them.
    App\Account\Domain\UserRepository: '@App\Account\Infrastructure\Doctrine\DoctrineUserRepository'
    App\Account\Domain\DeviceRepository: '@App\Account\Infrastructure\Doctrine\DoctrineDeviceRepository'
    App\Account\Domain\IdentityRepository: '@App\Account\Infrastructure\Doctrine\DoctrineIdentityRepository'
    App\Account\Application\GoogleAccounts: '@App\Account\Infrastructure\Google\GoogleOAuth'
    App\Workout\Domain\AttemptRepository: '@App\Workout\Infrastructure\Doctrine\DoctrineAttemptRepository'
    App\Workout\Domain\CustomExerciseRepository: '@App\Workout\Infrastructure\Doctrine\DoctrineCustomExerciseRepository'
    App\Workout\Domain\SettingsRepository: '@App\Workout\Infrastructure\Doctrine\DoctrineSettingsRepository'
    App\Content\Domain\ExerciseRepository: '@App\Content\Infrastructure\Doctrine\DoctrineExerciseRepository'
    App\Content\Domain\PageRepository: '@App\Content\Infrastructure\Doctrine\DoctrinePageRepository'
    App\Content\Application\ContentSource: '@App\Content\Infrastructure\Files\FileContentSource'
    App\Analytics\Domain\EventRepository: '@App\Analytics\Infrastructure\Doctrine\DoctrineEventRepository'
    App\Analytics\Application\EventMetrics: '@App\Analytics\Infrastructure\Doctrine\DoctrineEventMetrics'

    # The ports of the shared kernel that one module offers to the others.
    App\Shared\Application\GameContent: '@App\Content\Application\ContentForGame'
    App\Shared\Application\SignInMethods: '@App\Account\Application\AvailableSignInMethods'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@dev:
    parameters:
        # The development server listens on plain HTTP.
        app.device_cookie_secure: false

when@test:
    services:
        App\Tests\Account\FakeGoogle: ~
