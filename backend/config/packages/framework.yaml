# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

    assets:
        packages:
            # A file Vite built, by its source path: asset('node_modules/…/font.woff2', 'vite').
            vite:
                version_strategy: Pentatrion\ViteBundle\Asset\ViteAssetVersionStrategy

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        # Tests never call Google: a fake answers for its token endpoint (section 8 of the plan).
        http_client:
            mock_response_factory: App\Tests\Account\FakeGoogle
