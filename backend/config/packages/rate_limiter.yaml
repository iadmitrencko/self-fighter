parameters:
    # make e2e signs in in nearly every scenario of three browsers from one address.
    env(SIGN_IN_LIMIT): '30'

framework:
    rate_limiter:
        # Per IP address. A person signs in a few times a day at most, so a flood of starts is a script.
        sign_in:
            policy: sliding_window
            limit: '%env(int:SIGN_IN_LIMIT)%'
            interval: '1 hour'
        # Per user. Far above a real workout pace, it keeps a script from filling the database.
        api_write:
            policy: sliding_window
            limit: 300
            interval: '1 hour'
        # Per user. A fight sends two or three events.
        analytics_event:
            policy: sliding_window
            limit: 120
            interval: '1 hour'
