security:
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # Public pages stay outside: they neither read the device cookie nor depend on the user.
        api:
            pattern: ^/api/
            stateless: true
            # The authenticator loads the user itself, so the firewall needs no user provider.
            custom_authenticators:
                - App\Account\Presentation\Http\DeviceAuthenticator

    # Note: Only the *first* matching rule is applied
    access_control:
        # Anyone may ask who they are, and the first write creates a guest.
        - { path: ^/api/v1/me$, methods: [GET, POST], roles: PUBLIC_ACCESS }
        # An event of a visitor who has saved nothing yet stays without a user and creates none.
        - { path: ^/api/v1/events$, methods: [POST], roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_USER }
