security:
    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # Public pages stay outside: they neither read the device cookie nor depend on the user.
        api:
            pattern: ^/api/
            stateless: true
            # The authenticator loads the user itself, so the firewall needs no user provider.
            custom_authenticators:
                - App\Account\Presentation\Http\DeviceAuthenticator

    # Note: Only the *first* matching rule is applied
    access_control:
        # Anyone may ask who they are: a browser without an account gets no user (§23.1).
        - { path: ^/api/v1/me$, methods: [GET], roles: PUBLIC_ACCESS }
        # The game needs an account, so everything else does too, the events of §19 among them.
        - { path: ^/api/, roles: ROLE_USER }
