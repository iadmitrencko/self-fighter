doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'
        # Identifiers of the domain, kept in 16 bytes each.
        types:
            user_id: App\Shared\Infrastructure\Doctrine\UserIdType
            device_id: App\Account\Infrastructure\Doctrine\DeviceIdType
            attempt_id: App\Workout\Infrastructure\Doctrine\AttemptIdType
            exercise_id: App\Workout\Infrastructure\Doctrine\ExerciseIdType
            page_type: App\Content\Infrastructure\Doctrine\PageTypeType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        auto_mapping: true
        # The domain knows nothing of Doctrine: each module maps its entities next to its repositories.
        mappings:
            Account:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Account/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Account\Domain'
            Workout:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Workout/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Workout\Domain'
            Content:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Content/Infrastructure/Doctrine/Mapping'
                prefix: 'App\Content\Domain'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
