# End-to-end tests (make e2e): the production stack under its own project name and without host
# ports, so it runs next to the development stack. Playwright joins the network of the app container.
services:
  app:
    ports: !reset []
    # e2e/fake-google.mjs plays Google: Playwright starts it in the network of this container.
    environment:
      # The scenarios of three browsers come from one address, so they need more guests an hour.
      GUEST_CREATION_LIMIT: 1000
      GOOGLE_CLIENT_ID: e2e-client
      GOOGLE_CLIENT_SECRET: e2e-secret
      GOOGLE_AUTHORIZATION_URL: http://localhost:9100/authorize
      GOOGLE_TOKEN_URL: http://localhost:9100/token
